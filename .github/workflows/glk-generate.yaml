name: GLK Generate

on:
  pull_request:

jobs:
  glk-generate:
    uses: ./.github/workflows/glk.yaml
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    with:
      image-tag: v0.9.0
      glk-commands: |
        generate base -c landscapekitconfiguration.yaml .
      commit-message: 'chore: run gardener-landscape-kit'
